<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12031f">
<title>Для тебя 💖</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    overflow:hidden;
    background:radial-gradient(120% 90% at 50% 15%, #3d1157 0%, #1c0730 45%, #06010d 100%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none;}

  .screen{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px;text-align:center;
    transition:opacity .55s ease,transform .55s ease;
  }
  .hidden{opacity:0;pointer-events:none;transform:scale(.94);}

  .bigHeart{font-size:76px;line-height:1;animation:beat 1.6s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,80,160,.9));}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.14)}40%{transform:scale(.98)}}

  .title{
    font-size:clamp(26px,8vw,42px);font-weight:800;line-height:1.18;margin:18px 0 10px;
    background:linear-gradient(120deg,#fff,#ffb3d9,#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,90,160,.55));
  }
  .sub{margin:0 0 26px;font-size:16px;opacity:.75;}

  .btn{
    border:none;cursor:pointer;font-family:inherit;
    padding:17px 34px;border-radius:999px;
    font-size:18px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#ff4d94,#ff8fc7 50%,#ff4d94);
    box-shadow:0 10px 30px rgba(255,60,140,.45);
    animation:pulse 2s infinite;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.95);}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,90,160,.6),0 10px 30px rgba(255,60,140,.45);}
    70%{box-shadow:0 0 0 24px rgba(255,90,160,0),0 10px 30px rgba(255,60,140,.45);}
    100%{box-shadow:0 0 0 0 rgba(255,90,160,0),0 10px 30px rgba(255,60,140,.45);}
  }
  .btn.ghost{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:none;animation:none;font-size:15px;padding:13px 22px;font-weight:700;
  }

  /* сообщения */
  #messages{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:30px;}
  .msg{
    position:absolute;max-width:92vw;
    font-size:clamp(20px,6.4vw,34px);font-weight:800;line-height:1.25;
    opacity:0;transform:translateY(24px) scale(.92);
    transition:all .75s cubic-bezier(.2,.8,.3,1);
    text-shadow:0 0 32px rgba(255,80,150,.85),0 0 70px rgba(255,80,150,.4);
  }
  .msg.show{opacity:1;transform:translateY(0) scale(1);}

  /* камера */
  .camTitle{font-size:clamp(19px,5.4vw,26px);font-weight:800;margin:0 0 20px;text-shadow:0 0 24px rgba(255,80,150,.7);}
  .camHint{margin:20px 0 0;font-size:15px;opacity:.7;}
  .camFrame{
    position:relative;width:min(76vw,320px);aspect-ratio:1/1;border-radius:50%;
    overflow:hidden;border:4px solid transparent;
    background:linear-gradient(#000,#000) padding-box,
               linear-gradient(135deg,#ff4d94,#ffd9ec,#ff4d94) border-box;
    box-shadow:0 0 45px rgba(255,80,160,.65),0 0 110px rgba(255,80,160,.3);
    animation:glow 2.4s ease-in-out infinite;
  }
  @keyframes glow{50%{box-shadow:0 0 60px rgba(255,80,160,.95),0 0 140px rgba(255,80,160,.45);}}
  #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
  .camLoading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;opacity:.8;background:rgba(0,0,0,.5);
  }
  .countdown{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:92px;font-weight:900;pointer-events:none;
    text-shadow:0 0 40px rgba(255,60,140,.95),0 6px 20px rgba(0,0,0,.6);
  }
  .countdown.pop{animation:cd .7s ease-out;}
  @keyframes cd{0%{transform:scale(.4);opacity:0}35%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .5s ease;pointer-events:none;}
  .flash.on{opacity:1;transition:none;}

  /* результат */
  .polaroid{
    background:#fff;padding:11px 11px 46px;border-radius:8px;
    box-shadow:0 22px 55px rgba(0,0,0,.65);
    transform:rotate(-3deg);animation:pop .65s cubic-bezier(.2,1.5,.4,1);
    max-width:min(78vw,320px);
  }
  @keyframes pop{0%{transform:rotate(-14deg) scale(.6);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
  .polaroid img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;background:#111;}
  .polaroidCaption{
    font-family:'Bradley Hand','Segoe Script','Comic Sans MS',cursive;
    color:#e0438a;font-size:19px;margin-top:10px;text-align:center;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
  .hint{margin:14px 0 0;font-size:13.5px;opacity:.6;max-width:300px;}

  .toast{
    position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);
    background:rgba(255,255,255,.13);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.28);
    padding:12px 22px;border-radius:999px;font-size:15px;font-weight:700;
    opacity:0;transition:all .35s ease;z-index:10;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<!-- СТАРТ -->
<div class="screen" id="screenStart">
  <div class="bigHeart">💖</div>
  <h1 class="title">У меня для тебя<br>кое-что есть</h1>
  <p class="sub">Нажми на кнопку 👇</p>
  <button class="btn" id="startBtn">Открыть 💌</button>
</div>

<!-- СООБЩЕНИЯ -->
<div id="messages"></div>

<!-- КАМЕРА -->
<div class="screen hidden" id="screenCam">
  <p class="camTitle">Улыбнись, любимая 💕</p>
  <div class="camFrame">
    <video id="video" autoplay playsinline muted></video>
    <div class="camLoading" id="camLoading">включаю камеру…</div>
    <div class="countdown" id="countdown"></div>
    <div class="flash" id="flash"></div>
  </div>
  <p class="camHint">Сейчас будет фото 📸</p>
</div>

<!-- РЕЗУЛЬТАТ -->
<div class="screen hidden" id="screenResult">
  <p class="camTitle">Вот такая ты красивая 😍</p>
  <div class="polaroid">
    <img id="photo" alt="фото">
    <div class="polaroidCaption">самая любимая 💖</div>
  </div>
  <div class="row">
    <button class="btn" id="shareBtn">Отправить в чат 💌</button>
  </div>
  <div class="row">
    <button class="btn ghost" id="downloadBtn">Скачать</button>
    <button class="btn ghost" id="retryBtn">Ещё раз</button>
  </div>
  <p class="hint">Нажми «Отправить» и выбери чат с любимым 💕</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a,b) => a + Math.random()*(b-a);

  /* ================= КАНВАС: САЛЮТЫ И СЕРДЦА ================= */
  const canvas = $('fx');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, stars = [], parts = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    makeStars();
  }
  function makeStars(){
    stars = [];
    const n = Math.round((W*H)/9000);
    for (let i=0;i<n;i++){
      stars.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.4+0.3,
        p: Math.random()*Math.PI*2,
        s: 0.5 + Math.random()*1.6
      });
    }
  }
  window.addEventListener('resize', resize);

  function heartPath(cx, cy, size, rot){
    ctx.save();
    ctx.translate(cx, cy);
    if (rot) ctx.rotate(rot);
    const k = size/16;
    ctx.beginPath();
    for (let t=0; t<=Math.PI*2+0.001; t+=0.28){
      const x = 16*Math.pow(Math.sin(t),3);
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      if (t === 0) ctx.moveTo(x*k, y*k); else ctx.lineTo(x*k, y*k);
    }
    ctx.closePath();
    ctx.restore();
  }

  function spawnBurst(x, y){
    const base = Math.random() < 0.72 ? rand(300,360) : rand(0,360);
    const n = Math.round(rand(55, 95));
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = Math.pow(Math.random(),0.55) * rand(2,7.5);
      parts.push({
        t:'s', x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 1, dec: rand(0.007,0.018),
        col: `hsl(${base + rand(-32,32)},100%,${rand(62,88)}%)`,
        w: rand(1,2.6)
      });
    }
  }

  function spawnHeartBurst(x, y){
    for (let i=0;i<16;i++){
      const a = Math.random()*Math.PI*2;
      const sp = rand(1.5,5.5);
      parts.push({
        t:'h', x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1,
        size: rand(9,22), rot: rand(-0.5,0.5), rotV: rand(-0.03,0.03),
        life: 1, dec: rand(0.006,0.012),
        col: `hsl(${rand(318,352)},100%,${rand(66,86)}%)`,
        grav: 0.025
      });
    }
  }

  function spawnRisingHeart(){
    parts.push({
      t:'h', x: rand(-30, W+30), y: H + 50,
      vx: rand(-0.4,0.4), vy: -rand(0.5,1.7),
      size: rand(9,24), rot: rand(-0.4,0.4), rotV: rand(-0.02,0.02),
      life: 1, dec: rand(0.003,0.0065),
      col: `hsl(${rand(318,355)},95%,${rand(62,84)}%)`,
      wob: rand(0,Math.PI*2), wobA: rand(0.4,1.3)
    });
  }

  let lastT = performance.now();
  function frame(now){
    const dt = Math.min((now-lastT)/16.667, 3);
    lastT = now;

    ctx.clearRect(0,0,W,H);

    // звёзды
    for (const s of stars){
      s.p += 0.02*dt*s.s;
      ctx.globalAlpha = (0.3 + 0.7*(0.5+0.5*Math.sin(s.p))) * 0.9;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    // частицы
    for (let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.life -= p.dec*dt;
      if (p.life <= 0){ parts.splice(i,1); continue; }

      if (p.t === 's'){
        p.vy += 0.045*dt;
        const f = Math.pow(0.982, dt);
        p.vx *= f; p.vy *= f;
        p.x += p.vx*dt; p.y += p.vy*dt;

        ctx.globalAlpha = Math.min(1, p.life*1.5);
        ctx.strokeStyle = p.col;
        ctx.lineWidth = Math.max(0.4, p.w*p.life);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx*2.4, p.y - p.vy*2.4);
        ctx.stroke();
      } else {
        if (p.wob !== undefined){
          p.wob += 0.03*dt;
          p.x += (p.vx + Math.sin(p.wob)*p.wobA*0.4)*dt;
          p.y += p.vy*dt;
          if (p.y < -90) p.life = 0;
        } else {
          p.vy += (p.grav||0)*dt;
          const f = Math.pow(0.975, dt);
          p.vx *= f; p.vy *= f;
          p.x += p.vx*dt; p.y += p.vy*dt;
        }
        p.rot += p.rotV*dt;

        ctx.globalAlpha = Math.min(1, p.life*2.4);
        ctx.fillStyle = p.col;
        heartPath(p.x, p.y, p.size, p.rot);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);

  /* ================= САЛЮТНЫЙ ПЛАНИРОВЩИК ================= */
  let celebrating = false, fwTimer = null, heartTimer = null;

  function scheduleFirework(){
    fwTimer = setTimeout(function(){
      if (!celebrating) return;
      const x = rand(W*0.12, W*0.88);
      const y = rand(H*0.10, H*0.55);
      spawnBurst(x, y);
      if (Math.random() < 0.38) spawnHeartBurst(x, y);
      scheduleFirework();
    }, rand(280, 720));
  }

  /* ================= СООБЩЕНИЯ ================= */
  const messagesEl = $('messages');
  function showMessages(list, each){
    return new Promise(res => {
      let i = 0;
      (function next(){
        if (i >= list.length){ res(); return; }
        const el = document.createElement('div');
        el.className = 'msg';
        el.textContent = list[i++];
        messagesEl.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
          el.classList.remove('show');
          setTimeout(() => el.remove(), 800);
        }, Math.max(400, each - 850));
        setTimeout(next, each);
      })();
    });
  }

  /* ================= КАМЕРА ================= */
  let stream = null, photoBlob = null;

  function stopStream(){
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  function countdown(n){
    return new Promise(async res => {
      const el = $('countdown');
      for (let i=n; i>=1; i--){
        el.textContent = i;
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
        await sleep(760);
      }
      el.textContent = '';
      res();
    });
  }

  function capture(video){
    const flash = $('flash');
    flash.classList.add('on');

    const vw = video.videoWidth || 720;
    const vh = video.videoHeight || 720;
    const side = Math.min(vw, vh);
    const sx = (vw-side)/2, sy = (vh-side)/2;
    const out = 1000;

    const c = document.createElement('canvas');
    c.width = out; c.height = out;
    const g = c.getContext('2d');
    g.translate(out, 0); g.scale(-1, 1);          // зеркалим как в селфи
    g.drawImage(video, sx, sy, side, side, 0, 0, out, out);
    g.setTransform(1,0,0,1,0,0);

    return new Promise(res => {
      c.toBlob(b => {
        setTimeout(() => flash.classList.remove('on'), 70);
        res(b);
      }, 'image/jpeg', 0.92);
    });
  }

  function makeLoveCard(){
    const c = document.createElement('canvas');
    c.width = 1000; c.height = 1000;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0,0,1000,1000);
    grad.addColorStop(0,'#3d1157'); grad.addColorStop(1,'#12031f');
    g.fillStyle = grad; g.fillRect(0,0,1000,1000);
    for (let i=0;i<40;i++){
      g.globalAlpha = 0.15 + Math.random()*0.55;
      g.fillStyle = `hsl(${320+Math.random()*35},100%,${65+Math.random()*20}%)`;
      const x = Math.random()*1000, y = Math.random()*1000, s = 8+Math.random()*26;
      g.save(); g.translate(x,y); g.rotate(Math.random()*1.5-0.75);
      g.beginPath(); g.moveTo(0, s*0.35);
      g.bezierCurveTo(-s, -s*0.35, -s*0.55, -s, 0, -s*0.45);
      g.bezierCurveTo(s*0.55, -s, s, -s*0.35, 0, s*0.35);
      g.fill(); g.restore();
    }
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.fillStyle = '#fff';
    g.font = 'bold 74px -apple-system, Segoe UI, Roboto, sans-serif';
    g.fillText('Ты самая любимая 💖', 500, 530);
    g.font = '40px -apple-system, Segoe UI, Roboto, sans-serif';
    g.globalAlpha = 0.75;
    g.fillText('(камера не захотела включаться, но это неважно)', 500, 610);
    return new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
  }

  async function startCamera(){
    const screenCam = $('screenCam');
    screenCam.classList.remove('hidden');
    const video = $('video');

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('no getUserMedia');
      }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false
      });
      video.srcObject = stream;
      try { await video.play(); } catch(e){}
      await sleep(900);
      $('camLoading').style.display = 'none';

      await countdown(3);
      const blob = await capture(video);
      photoBlob = blob;
      stopStream();
      showResult(blob);

    } catch (err){
      console.warn('camera error:', err);
      stopStream();
      $('camLoading').textContent = 'камера недоступна';
      await sleep(900);
      photoBlob = await makeLoveCard();
      screenCam.classList.add('hidden');
      showResult(photoBlob);
    }
  }

  /* ================= РЕЗУЛЬТАТ ================= */
  function showResult(blob){
    $('screenCam').classList.add('hidden');
    $('photo').src = URL.createObjectURL(blob);
    $('screenResult').classList.remove('hidden');

    for (let i=0;i<6;i++){
      setTimeout(() => {
        spawnBurst(rand(W*0.15, W*0.85), rand(H*0.12, H*0.5));
      }, i*170);
    }
    setTimeout(() => spawnHeartBurst(W/2, H*0.32), 250);
    setTimeout(() => spawnHeartBurst(W/2, H*0.32), 900);
  }

  function toast(text){
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 2200);
  }

  async function sharePhoto(){
    if (!photoBlob) return;
    const file = new File([photoBlob], 'love.jpg', { type: 'image/jpeg' });
    const text = 'Ты — самая любимая 💖';

    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file], text: text });
        toast('Отправлено 💌');
        return;
      } catch (e){
        if (e && e.name === 'AbortError') return;
      }
    }
    downloadPhoto();
  }

  function downloadPhoto(){
    if (!photoBlob) return;
    const url = URL.createObjectURL(photoBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'love.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Фото сохранено 💾');
  }

  /* ================= СТАРТ ВСЕГО ================= */
  async function start(){
    $('screenStart').classList.add('hidden');

    celebrating = true;
    scheduleFirework();
    if (heartTimer) clearInterval(heartTimer);
    heartTimer = setInterval(spawnRisingHeart, 320);

    spawnBurst(W*0.5, H*0.30);
    setTimeout(() => spawnHeartBurst(W*0.28, H*0.42), 320);
    setTimeout(() => spawnBurst(W*0.76, H*0.24), 640);

    await sleep(500);

    await showMessages([
      'Привет, любимая 💖',
      'Этот салют — в твою честь 🎆',
      'Ты делаешь мой мир ярче ✨',
      'А теперь улыбнись… 📸'
    ], 1700);

    await sleep(350);
    await startCamera();
  }

  $('startBtn').addEventListener('click', start);
  $('shareBtn').addEventListener('click', sharePhoto);
  $('downloadBtn').addEventListener('click', downloadPhoto);
  $('retryBtn').addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
